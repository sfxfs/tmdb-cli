[project]
name = "tmdb-cli"
version = "0.1.0"
description = "TMDB API CLI — movie and TV series metadata scraper"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "sfxfs", email = "2501683578@qq.com" }
]
keywords = ["tmdb", "movie", "tv", "metadata", "scraper", "nfo", "kodi", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "mypy>=1.0",
    "ruff>=0.5",
]

[project.scripts]
tmdb = "tmdb_cli.main:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
